name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Standalone-Paket schnüren
        run: |
          set -e
          OUT=release
          rm -rf $OUT && mkdir -p $OUT
          cp -r .next/standalone/. $OUT/
          mkdir -p $OUT/.next
          cp -r .next/static $OUT/.next/static
          cp -r public $OUT/public
          # Gateway für den Server-Modus (läuft auf dem Pod neben der App)
          cp pod/pod-gateway.mjs $OUT/pod-gateway.mjs
          tar -czf pod-frontend.tar.gz -C $OUT .
          ls -lh pod-frontend.tar.gz

      - name: Release "latest" ersetzen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest pod-frontend.tar.gz \
            --title "latest ($(git rev-parse --short HEAD))" \
            --notes "Automatischer Build von ${GITHUB_SHA}" \
            --target "${GITHUB_SHA}" \
            --latest
          # Sicherstellen, dass es kein Entwurf bleibt – Entwürfe sind für Pods und Server unsichtbar (404)
          for i in 1 2 3 4 5; do
            [ "$(gh release view latest --json isDraft -q .isDraft)" = "false" ] && break
            echo "Release ist noch Entwurf – veröffentliche (Versuch $i)"
            gh release edit latest --draft=false --latest || true
            sleep 3
          done
          [ "$(gh release view latest --json isDraft -q .isDraft)" = "false" ] || { echo "Release blieb Entwurf"; exit 1; }
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/latest" -q '.assets[].name' | grep -qx pod-frontend.tar.gz
